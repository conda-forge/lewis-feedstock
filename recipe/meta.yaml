{% set name = "lewis" %}
{% set version = "1.4.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fd165f558e69a6447b66089bf055290f6c2c4be7db604e20bde2337df87036f0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - lewis = lewis.scripts.run:run_simulation
    - lewis-control = lewis.scripts.control:control_simulation

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - pyzmq
    - json-rpc
    - semantic_version
    - pyyaml
    - scanf

test:
  imports:
    - lewis
  requires:
    - python {{ python_min }}
    - pip
  commands:
    - pip check
    - lewis --help
    - lewis-control -h

about:
  home: https://github.com/ISISComputingGroup/lewis
  summary: Lewis - Let's write intricate simulators!
  license: GPL-3.0-only
  license_family: GPL
  license_file: LICENSE
  dev_url: https://github.com/ISISComputingGroup/lewis
  doc_url: https://isiscomputinggroup.github.io/lewis/

extra:
  recipe-maintainers:
    - anderslindho
